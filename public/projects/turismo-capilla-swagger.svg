<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sw-tc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#151e30"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sw-tc)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="55" fill="#0f172a" rx="16"/>
  <rect x="25" y="15" width="28" height="28" rx="6" fill="#85ea2d"/>
  <text x="32" y="34" fill="#111827" font-family="monospace" font-size="16" font-weight="900">{ }</text>
  <text x="65" y="34" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold">Swagger UI <tspan fill="#64748b" font-size="14">/ Turismo Capilla API (SpringDoc 2.8.5)</tspan></text>
  <rect x="670" y="15" width="100" height="28" rx="6" fill="#0284c7"/>
  <text x="685" y="34" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">Authorize 🔒</text>

  <!-- Title section -->
  <text x="40" y="95" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">Portal de Turismo Capilla del Monte - Endpoints REST</text>
  <text x="40" y="118" fill="#94a3b8" font-family="monospace" font-size="12">[ Base URL: localhost:8080/api/v1 ] • Spring Security 6 JWT Bearer</text>

  <!-- Endpoint 1: POST /bookings -->
  <g transform="translate(40, 140)">
    <rect width="720" height="46" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="9" width="65" height="28" rx="4" fill="#10b981"/>
    <text x="24" y="28" fill="#022c22" font-family="monospace" font-size="13" font-weight="900">POST</text>
    <text x="95" y="28" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">/api/v1/bookings</text>
    <text x="340" y="28" fill="#a7f3d0" font-family="monospace" font-size="11">Crea reserva transaccional con validación anti-overbooking</text>
    <text x="675" y="29" fill="#34d399" font-family="monospace" font-size="13">201</text>
  </g>

  <!-- Endpoint 2: GET /accommodations -->
  <g transform="translate(40, 195)">
    <rect width="720" height="46" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="12" y="9" width="65" height="28" rx="4" fill="#0284c7"/>
    <text x="30" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900">GET</text>
    <text x="95" y="28" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">/api/v1/accommodations</text>
    <text x="340" y="28" fill="#bae6fd" font-family="monospace" font-size="11">Catálogo de hospedajes filtrado por fechas y comodidades</text>
    <text x="675" y="29" fill="#38bdf8" font-family="monospace" font-size="13">200</text>
  </g>

  <!-- Endpoint 3: POST /invitations/tokens -->
  <g transform="translate(40, 250)">
    <rect width="720" height="46" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="12" y="9" width="65" height="28" rx="4" fill="#a855f7"/>
    <text x="24" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900">POST</text>
    <text x="95" y="28" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">/api/v1/invitations/tokens</text>
    <text x="340" y="28" fill="#d8b4fe" font-family="monospace" font-size="11">[ADMIN] Genera token con validez de 7 días para prestadores</text>
    <text x="675" y="29" fill="#c084fc" font-family="monospace" font-size="13">201</text>
  </g>

  <!-- Endpoint 4: GET /attractions -->
  <g transform="translate(40, 305)">
    <rect width="720" height="46" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="12" y="9" width="65" height="28" rx="4" fill="#0284c7"/>
    <text x="30" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900">GET</text>
    <text x="95" y="28" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">/api/v1/attractions</text>
    <text x="340" y="28" fill="#bae6fd" font-family="monospace" font-size="11">Listado de circuitos turísticos, cerros y paseos habilitados</text>
    <text x="675" y="29" fill="#38bdf8" font-family="monospace" font-size="13">200</text>
  </g>

  <!-- Endpoint 5: GET /bookings/my-reservations -->
  <g transform="translate(40, 360)">
    <rect width="720" height="46" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="12" y="9" width="65" height="28" rx="4" fill="#0284c7"/>
    <text x="30" y="28" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900">GET</text>
    <text x="95" y="28" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">/api/v1/bookings/my-reservations</text>
    <text x="340" y="28" fill="#bae6fd" font-family="monospace" font-size="11">[HOST/TOURIST] Panel de reservas activas e historial auditado</text>
    <text x="675" y="29" fill="#38bdf8" font-family="monospace" font-size="13">200</text>
  </g>
</svg>

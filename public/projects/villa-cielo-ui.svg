<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vc-ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a150e"/>
      <stop offset="100%" stop-color="#122418"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#vc-ui)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#2d4a36" stroke-width="2" rx="15"/>

  <!-- Top bar -->
  <text x="40" y="45" fill="#4ade80" font-family="monospace" font-size="20" font-weight="bold">INTERFAZ &amp; EXPERIENCIA DE USUARIO (VILLA CIELO)</text>
  <text x="40" y="70" fill="#94a3b8" font-family="monospace" font-size="12">Gamificación en territorio • Escáner QR de senderos y concientización</text>

  <!-- Screens -->
  <!-- Screen 1: Scan & Trivia -->
  <g transform="translate(40, 105)">
    <rect width="210" height="200" rx="12" fill="#132318" stroke="#22c55e" stroke-width="1.5"/>
    <rect width="210" height="32" rx="12" fill="#166534"/>
    <text x="15" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">🔍 ESCÁNER Y TRIVIA</text>
    <rect x="65" y="50" width="80" height="80" rx="8" fill="#1e3a27" stroke="#4ade80"/>
    <text x="80" y="95" fill="#86efac" font-family="monospace" font-size="24">QR 📲</text>
    <text x="15" y="155" fill="#cbd5e1" font-family="monospace" font-size="11">Desbloqueo de especies</text>
    <text x="15" y="175" fill="#86efac" font-family="monospace" font-size="11">Preguntas y respuestas</text>
  </g>

  <!-- Screen 2: Flora Library -->
  <g transform="translate(295, 105)">
    <rect width="210" height="200" rx="12" fill="#132318" stroke="#eab308" stroke-width="1.5"/>
    <rect width="210" height="32" rx="12" fill="#854d0e"/>
    <text x="15" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">🌿 GUÍA DE ESPECIES</text>
    <rect x="20" y="50" width="170" height="40" rx="6" fill="#1e3a27"/>
    <text x="30" y="75" fill="#fef08a" font-family="monospace" font-size="12">🌳 Árbol Molle</text>
    <rect x="20" y="100" width="170" height="40" rx="6" fill="#1e3a27"/>
    <text x="30" y="125" fill="#fef08a" font-family="monospace" font-size="12">🌺 Orquídeas Nativas</text>
    <text x="15" y="175" fill="#cbd5e1" font-family="monospace" font-size="11">Fichas botánicas ilustradas</text>
  </g>

  <!-- Screen 3: Fire Safety -->
  <g transform="translate(550, 105)">
    <rect width="210" height="200" rx="12" fill="#132318" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="210" height="32" rx="12" fill="#991b1b"/>
    <text x="15" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">🚨 PROTOCOLO FUEGO</text>
    <rect x="20" y="55" width="170" height="50" rx="8" fill="#450a0a" stroke="#f87171"/>
    <text x="35" y="85" fill="#fecaca" font-family="monospace" font-size="13" font-weight="bold">📞 LLAMAR 100 / 911</text>
    <text x="15" y="145" fill="#fca5a5" font-family="monospace" font-size="11">Guía preventiva para el monte</text>
    <text x="15" y="165" fill="#cbd5e1" font-family="monospace" font-size="11">Consejos contra incendios</text>
  </g>

  <!-- Bottom info -->
  <g transform="translate(40, 325)">
    <rect width="720" height="95" rx="12" fill="#0f1c14" stroke="#2d4a36"/>
    <text x="25" y="32" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">▸ ACCESIBILIDAD UNIVERSAL</text>
    <text x="25" y="58" fill="#cbd5e1" font-family="monospace" font-size="12">✓ Botones de cambio dinámico: Texto Grande para personas mayores y Lenguaje Junior para niños.</text>
    <text x="25" y="80" fill="#4ade80" font-family="monospace" font-size="12">✓ Optimizado para uso en celulares de visitantes durante el recorrido por la reserva.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#stk-grad)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Grid lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#1e293b" stroke-width="1" opacity="0.6"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#eab308"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  <text x="115" y="45" fill="#94a3b8" font-family="monospace" font-size="14">https://api.stockflow.dev/v1/inventory</text>

  <!-- Title & Badge -->
  <text x="50" y="115" fill="#f8fafc" font-family="monospace" font-size="26" font-weight="bold">STOCKFLOW • GESTIÓN DE INVENTARIO</text>
  <rect x="50" y="130" width="125" height="24" rx="12" fill="#064e3b" stroke="#10b981"/>
  <text x="65" y="146" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">JAVA 17 / SPRING</text>
  
  <rect x="185" y="130" width="130" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="200" y="146" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="bold">HEXAGONAL ARCH</text>

  <!-- Modules -->
  <g transform="translate(50, 180)">
    <rect width="210" height="100" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold">Módulo Productos</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">SKU, Categorías, Alertas</text>
    <text x="20" y="78" fill="#64748b" font-family="monospace" font-size="11">Control de Stock Crítico</text>
  </g>

  <g transform="translate(295, 180)">
    <rect width="210" height="100" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">Módulo Pedidos</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Transacciones Atómicas</text>
    <text x="20" y="78" fill="#64748b" font-family="monospace" font-size="11">@Transactional &amp; Rollback</text>
  </g>

  <g transform="translate(540, 180)">
    <rect width="210" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="32" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="bold">Auditoría &amp; Logs</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Trazabilidad de Movimientos</text>
    <text x="20" y="78" fill="#64748b" font-family="monospace" font-size="11">Historial Operativo</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 310)">
    <rect width="700" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="35" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">▸ ENFOQUE Y BENEFICIOS DE NEGOCIO</text>
    <text x="25" y="62" fill="#94a3b8" font-family="monospace" font-size="12">✓ Diseñado para sistematizar logística, trazabilidad de artículos y stock en tiempo real.</text>
    <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="12">✓ Persistencia optimizada con queries derivadas en Spring Data JPA e índices MySQL.</text>
  </g>
</svg>

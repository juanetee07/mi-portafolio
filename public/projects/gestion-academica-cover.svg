<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ga-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111a"/>
      <stop offset="100%" stop-color="#141a28"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ga-bg)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#eab308"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  <text x="115" y="45" fill="#94a3b8" font-family="monospace" font-size="13">https://gestion.upc.edu.ar/portal/resoluciones</text>

  <!-- Title -->
  <text x="50" y="105" fill="#f8fafc" font-family="monospace" font-size="23" font-weight="bold">SISTEMA DE GESTIÓN Y VALIDACIÓN ACADÉMICA</text>
  <text x="50" y="130" fill="#94a3b8" font-family="monospace" font-size="13">Plataforma Institucional • Resoluciones, Noticias &amp; Auditoría</text>

  <!-- Modules -->
  <g transform="translate(50, 160)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="20" y="32" fill="#60a5fa" font-family="monospace" font-size="15" font-weight="bold">Resoluciones &amp; Noticias</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Gestión de Publicaciones</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Información Oficial</text>
    <text x="20" y="93" fill="#60a5fa" font-family="monospace" font-size="11">Acceso Centralizado</text>
  </g>

  <g transform="translate(295, 160)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold">Roles &amp; Permisos</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Validación de Usuarios</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Control de Acceso RBAC</text>
    <text x="20" y="93" fill="#34d399" font-family="monospace" font-size="11">Participación Regulada</text>
  </g>

  <g transform="translate(540, 160)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="32" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="bold">Historial &amp; Trazabilidad</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Logs de Auditoría</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Trazabilidad de Cambios</text>
    <text x="20" y="93" fill="#fbbf24" font-family="monospace" font-size="11">Transparencia Institucional</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 295)">
    <rect width="700" height="120" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="35" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">▸ ESPECIFICACIONES DE ARQUITECTURA</text>
    <text x="25" y="65" fill="#94a3b8" font-family="monospace" font-size="12">✓ Backend desarrollado con Java 17 y Spring Boot, conectando servicios CRUD con MySQL.</text>
    <text x="25" y="88" fill="#94a3b8" font-family="monospace" font-size="12">✓ Sistema diseñado para la administración transparente de información académica e institucional.</text>
    <text x="25" y="108" fill="#60a5fa" font-family="monospace" font-size="11">Desacoplamiento limpio entre repositorio Backend e interfaz Frontend (UPC).</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a131f"/>
      <stop offset="100%" stop-color="#112238"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#tc-bg)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#eab308"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  <text x="115" y="45" fill="#94a3b8" font-family="monospace" font-size="13">https://api.turismocapilla.gob.ar/api/v1/bookings</text>

  <!-- Title -->
  <text x="50" y="105" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold">TURISMO CAPILLA DEL MONTE</text>
  <text x="50" y="130" fill="#94a3b8" font-family="monospace" font-size="13">Motor de Reservas, Hospedajes, Atractivos &amp; Tokens de Invitación</text>

  <!-- Domain Modules -->
  <g transform="translate(50, 160)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">Hospedajes</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Cabañas, Hoteles, Campings</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Geolocalización &amp; Precios</text>
    <text x="20" y="93" fill="#06b6d4" font-family="monospace" font-size="11">UUID Nativo PostgreSQL</text>
  </g>

  <g transform="translate(295, 160)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="32" fill="#c084fc" font-family="monospace" font-size="15" font-weight="bold">Motor Anti-Overbooking</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Validación Check-in / Out</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Código CAP-YYYY-XXXX</text>
    <text x="20" y="93" fill="#a855f7" font-family="monospace" font-size="11">Transacciones Atómicas</text>
  </g>

  <g transform="translate(540, 160)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold">Seguridad &amp; Onboarding</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">Spring Security 6 + JWT</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Tokens de 7 Días Prestador</text>
    <text x="20" y="93" fill="#10b981" font-family="monospace" font-size="11">Roles: ADMIN, HOST, TOURIST</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 295)">
    <rect width="700" height="120" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="35" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">▸ ESPECIFICACIONES TÉCNICAS BACKEND (UPC)</text>
    <text x="25" y="65" fill="#94a3b8" font-family="monospace" font-size="12">✓ Java 17 + Spring Boot 3 + PostgreSQL 18 con relaciones JPA e integridad referencial.</text>
    <text x="25" y="88" fill="#94a3b8" font-family="monospace" font-size="12">✓ Documentación OpenAPI 3.0 / Swagger UI interactivo con autenticación Bearer Token.</text>
    <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">Desarrollado para la cátedra de Programación III / Práctica Profesionalizante II (UPC).</text>
  </g>
</svg>

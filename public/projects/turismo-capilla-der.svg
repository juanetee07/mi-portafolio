<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="der-tc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#der-tc)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="40" y="42" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">MODELO ENTIDAD-RELACIÓN • TURISMO CAPILLA (PostgreSQL 18)</text>
  <text x="40" y="65" fill="#94a3b8" font-family="monospace" font-size="12">Identificación UUID nativa • Integridad referencial y constraints anti-overbooking</text>

  <!-- Table 1: USERS -->
  <g transform="translate(40, 95)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <rect width="210" height="30" rx="8" fill="#0e7490"/>
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TABLE: users</text>
    <text x="15" y="52" fill="#facc15" font-family="monospace" font-size="11">🔑 id: UUID (PK)</text>
    <text x="15" y="74" fill="#94a3b8" font-family="monospace" font-size="11">  email: VARCHAR (UNIQUE)</text>
    <text x="15" y="96" fill="#94a3b8" font-family="monospace" font-size="11">  password: VARCHAR (BCrypt)</text>
    <text x="15" y="118" fill="#94a3b8" font-family="monospace" font-size="11">  role: ENUM (ADMIN, HOST, TOURIST)</text>
    <text x="15" y="138" fill="#94a3b8" font-family="monospace" font-size="11">  created_at: TIMESTAMP</text>
  </g>

  <!-- Table 2: ACCOMMODATIONS -->
  <g transform="translate(300, 95)">
    <rect width="225" height="165" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <rect width="225" height="30" rx="8" fill="#7e22ce"/>
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TABLE: accommodations</text>
    <text x="15" y="52" fill="#facc15" font-family="monospace" font-size="11">🔑 id: UUID (PK)</text>
    <text x="15" y="74" fill="#67e8f9" font-family="monospace" font-size="11">⚓ host_id: UUID (FK -&gt; users)</text>
    <text x="15" y="96" fill="#94a3b8" font-family="monospace" font-size="11">  name: VARCHAR(120)</text>
    <text x="15" y="118" fill="#94a3b8" font-family="monospace" font-size="11">  type: ENUM (CABIN, HOTEL...)</text>
    <text x="15" y="138" fill="#94a3b8" font-family="monospace" font-size="11">  price_per_night: NUMERIC</text>
    <text x="15" y="156" fill="#94a3b8" font-family="monospace" font-size="11">  lat / lng: FLOAT</text>
  </g>

  <!-- Table 3: BOOKINGS -->
  <g transform="translate(565, 95)">
    <rect width="200" height="185" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <rect width="200" height="30" rx="8" fill="#047857"/>
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TABLE: bookings (CORE)</text>
    <text x="15" y="52" fill="#facc15" font-family="monospace" font-size="11">🔑 id: UUID (PK)</text>
    <text x="15" y="74" fill="#a855f7" font-family="monospace" font-size="11">⚓ accommodation_id: UUID (FK)</text>
    <text x="15" y="96" fill="#67e8f9" font-family="monospace" font-size="11">⚓ tourist_id: UUID (FK)</text>
    <text x="15" y="118" fill="#facc15" font-family="monospace" font-size="11">  code: VARCHAR (CAP-YYYY-XXXX)</text>
    <text x="15" y="138" fill="#94a3b8" font-family="monospace" font-size="11">  check_in / check_out: DATE</text>
    <text x="15" y="158" fill="#94a3b8" font-family="monospace" font-size="11">  total_price: NUMERIC</text>
    <text x="15" y="176" fill="#94a3b8" font-family="monospace" font-size="11">  status: ENUM</text>
  </g>

  <!-- Table 4: INVITATION_TOKENS -->
  <g transform="translate(40, 280)">
    <rect width="210" height="135" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect width="210" height="30" rx="8" fill="#b45309"/>
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TABLE: invitation_tokens</text>
    <text x="15" y="52" fill="#facc15" font-family="monospace" font-size="11">🔑 id: UUID (PK)</text>
    <text x="15" y="74" fill="#94a3b8" font-family="monospace" font-size="11">  token: VARCHAR (UNIQUE)</text>
    <text x="15" y="96" fill="#67e8f9" font-family="monospace" font-size="11">⚓ created_by: UUID (FK)</text>
    <text x="15" y="118" fill="#94a3b8" font-family="monospace" font-size="11">  expires_at: 7 DAYS VALIDITY</text>
  </g>

  <!-- Table 5: ATTRACTIONS -->
  <g transform="translate(300, 280)">
    <rect width="225" height="135" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <rect width="225" height="30" rx="8" fill="#be185d"/>
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TABLE: attractions</text>
    <text x="15" y="52" fill="#facc15" font-family="monospace" font-size="11">🔑 id: UUID (PK)</text>
    <text x="15" y="74" fill="#94a3b8" font-family="monospace" font-size="11">  name: VARCHAR(100)</text>
    <text x="15" y="96" fill="#94a3b8" font-family="monospace" font-size="11">  category: HILL, RIVER_BEACH...</text>
    <text x="15" y="118" fill="#94a3b8" font-family="monospace" font-size="11">  difficulty: LOW, MID, HIGH</text>
  </g>

  <!-- Table 6: ACCOMMODATION_IMAGES -->
  <g transform="translate(565, 300)">
    <rect width="200" height="115" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="#1d4ed8"/>
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TABLE: accommodation_images</text>
    <text x="15" y="52" fill="#facc15" font-family="monospace" font-size="11">🔑 id: UUID (PK)</text>
    <text x="15" y="74" fill="#a855f7" font-family="monospace" font-size="11">⚓ accommodation_id: UUID (FK)</text>
    <text x="15" y="96" fill="#94a3b8" font-family="monospace" font-size="11">  image_url: VARCHAR</text>
  </g>

  <!-- Connector Lines -->
  <path d="M250 145 H300" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
  <path d="M525 145 H565" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
  <path d="M145 245 V280" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
</svg>

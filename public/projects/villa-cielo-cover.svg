<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1811"/>
      <stop offset="100%" stop-color="#14281b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#vc-bg)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#2d4a36" stroke-width="2" rx="15"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#132318" stroke="#2d4a36"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#eab308"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  <text x="115" y="45" fill="#86efac" font-family="monospace" font-size="13">https://villacielo.reserva.org/explorar</text>

  <!-- Title -->
  <text x="50" y="105" fill="#4ade80" font-family="monospace" font-size="24" font-weight="bold">RESERVA NATURAL VILLA CIELO</text>
  <text x="50" y="130" fill="#cbd5e1" font-family="monospace" font-size="13">Plataforma Interactiva de Biodiversidad, Educación Ambiental &amp; SOS Incendios</text>

  <!-- Modules -->
  <g transform="translate(50, 160)">
    <rect width="210" height="110" rx="10" fill="#172e20" stroke="#22c55e" stroke-width="2"/>
    <text x="20" y="32" fill="#86efac" font-family="monospace" font-size="15" font-weight="bold">Escaneo QR &amp; Trivia</text>
    <text x="20" y="55" fill="#cbd5e1" font-family="monospace" font-size="12">Desbloqueo en Sendero</text>
    <text x="20" y="75" fill="#86efac" font-family="monospace" font-size="11">Gamificación con Recompensas</text>
    <text x="20" y="93" fill="#cbd5e1" font-family="monospace" font-size="11">Perfiles Adulto y Junior</text>
  </g>

  <g transform="translate(295, 160)">
    <rect width="210" height="110" rx="10" fill="#172e20" stroke="#eab308" stroke-width="2"/>
    <text x="20" y="32" fill="#fde047" font-family="monospace" font-size="15" font-weight="bold">Biblioteca de Flora</text>
    <text x="20" y="55" fill="#cbd5e1" font-family="monospace" font-size="12">Fichas de Especies Serranas</text>
    <text x="20" y="75" fill="#fde047" font-family="monospace" font-size="11">Molle, Orquídeas y Helechos</text>
    <text x="20" y="93" fill="#cbd5e1" font-family="monospace" font-size="11">Buscador y Categorías</text>
  </g>

  <g transform="translate(540, 160)">
    <rect width="210" height="110" rx="10" fill="#172e20" stroke="#ef4444" stroke-width="2"/>
    <text x="20" y="32" fill="#f87171" font-family="monospace" font-size="15" font-weight="bold">SOS Incendios</text>
    <text x="20" y="55" fill="#cbd5e1" font-family="monospace" font-size="12">Protocolo de Emergencias</text>
    <text x="20" y="75" fill="#f87171" font-family="monospace" font-size="11">Llamada Rápida Bomberos</text>
    <text x="20" y="93" fill="#cbd5e1" font-family="monospace" font-size="11">Prevención Comunitaria</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 295)">
    <rect width="700" height="120" rx="12" fill="#0f1c14" stroke="#2d4a36"/>
    <text x="25" y="35" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">▸ TECNOLOGÍA &amp; ACCESIBILIDAD</text>
    <text x="25" y="65" fill="#cbd5e1" font-family="monospace" font-size="12">✓ Desarrollado en React 19 + Tailwind CSS + Lucide Icons con diseño mobile-first y modo oscuro.</text>
    <text x="25" y="88" fill="#cbd5e1" font-family="monospace" font-size="12">✓ Modo de accesibilidad visual con tipografía agrandada y lenguaje adaptado para niños y adultos.</text>
    <text x="25" y="108" fill="#4ade80" font-family="monospace" font-size="11">Iniciativa de concientización comunitaria para la Reserva de Villa Cielo (Capilla del Monte).</text>
  </g>
</svg>

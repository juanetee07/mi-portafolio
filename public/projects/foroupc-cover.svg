<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Grid lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#1e293b" stroke-width="1" opacity="0.6"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <circle cx="45" cy="40" r="6" fill="#ef4444"/>
  <circle cx="65" cy="40" r="6" fill="#eab308"/>
  <circle cx="85" cy="40" r="6" fill="#22c55e"/>
  <text x="115" y="45" fill="#94a3b8" font-family="monospace" font-size="14">https://api.foroupc.edu.ar/v1/endpoints</text>

  <!-- Title & Badge -->
  <text x="50" y="115" fill="#f8fafc" font-family="monospace" font-size="26" font-weight="bold">FORO UPC • ARQUITECTURA CORE</text>
  <rect x="50" y="130" width="130" height="24" rx="12" fill="#3b0764" stroke="#a855f7"/>
  <text x="65" y="146" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold">SPRING BOOT 3</text>
  
  <rect x="190" y="130" width="110" height="24" rx="12" fill="#083344" stroke="#06b6d4"/>
  <text x="205" y="146" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="bold">RESTful API</text>

  <!-- Architecture Boxes -->
  <!-- Controller Layer -->
  <g transform="translate(50, 175)">
    <rect width="200" height="95" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">Controllers</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">@RestController</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Topicos, Respuestas</text>
  </g>

  <!-- Service Layer -->
  <g transform="translate(300, 175)">
    <rect width="200" height="95" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="32" fill="#c084fc" font-family="monospace" font-size="15" font-weight="bold">Service Layer</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">@Service</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Reglas de Negocio</text>
  </g>

  <!-- Repository Layer -->
  <g transform="translate(550, 175)">
    <rect width="200" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold">JPA Repository</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="12">@Repository</text>
    <text x="20" y="75" fill="#64748b" font-family="monospace" font-size="11">Spring Data &amp; MySQL</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M255 222 H295" stroke="#38bdf8" stroke-width="3"/>
  <path d="M505 222 H545" stroke="#c084fc" stroke-width="3"/>

  <!-- Bottom Details -->
  <g transform="translate(50, 300)">
    <rect width="700" height="115" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="35" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">▸ ESPECIFICACIONES DE CAPAS &amp; VALIDACIÓN</text>
    <text x="25" y="65" fill="#94a3b8" font-family="monospace" font-size="12">✓ DTOs para solicitudes y respuestas con Jakarta Bean Validation (@Valid, @NotNull)</text>
    <text x="25" y="90" fill="#94a3b8" font-family="monospace" font-size="12">✓ Manejo centralizado de excepciones con @RestControllerAdvice (404, 400, 500)</text>
  </g>
</svg>

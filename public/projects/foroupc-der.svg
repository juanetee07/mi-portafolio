<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#171e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#db-grad)" rx="16"/>
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="40" y="45" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">DIAGRAMA ENTIDAD-RELACIÓN (JPA / MySQL)</text>
  <text x="40" y="68" fill="#94a3b8" font-family="monospace" font-size="12">Mapeo con Hibernate • Relaciones @OneToMany y @ManyToOne</text>

  <!-- Table 1: USUARIOS -->
  <g transform="translate(40, 100)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <rect width="210" height="32" rx="8" fill="#0e7490"/>
    <text x="15" y="22" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">TABLE: usuarios</text>
    <text x="15" y="55" fill="#facc15" font-family="monospace" font-size="12">🔑 id: BIGINT (PK)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="12">  nombre: VARCHAR(100)</text>
    <text x="15" y="105" fill="#94a3b8" font-family="monospace" font-size="12">  email: VARCHAR(120)</text>
    <text x="15" y="130" fill="#94a3b8" font-family="monospace" font-size="12">  clave: VARCHAR(255)</text>
  </g>

  <!-- Table 2: CURSOS -->
  <g transform="translate(40, 275)">
    <rect width="210" height="130" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect width="210" height="32" rx="8" fill="#047857"/>
    <text x="15" y="22" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">TABLE: cursos</text>
    <text x="15" y="55" fill="#facc15" font-family="monospace" font-size="12">🔑 id: BIGINT (PK)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="12">  nombre: VARCHAR(80)</text>
    <text x="15" y="105" fill="#94a3b8" font-family="monospace" font-size="12">  categoria: VARCHAR(50)</text>
  </g>

  <!-- Table 3: TOPICOS -->
  <g transform="translate(300, 140)">
    <rect width="225" height="210" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2.5"/>
    <rect width="225" height="32" rx="8" fill="#7e22ce"/>
    <text x="15" y="22" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">TABLE: topicos (CORE)</text>
    <text x="15" y="55" fill="#facc15" font-family="monospace" font-size="12">🔑 id: BIGINT (PK)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="12">  titulo: VARCHAR(150)</text>
    <text x="15" y="105" fill="#94a3b8" font-family="monospace" font-size="12">  mensaje: TEXT</text>
    <text x="15" y="130" fill="#94a3b8" font-family="monospace" font-size="12">  fecha_creacion: DATETIME</text>
    <text x="15" y="155" fill="#94a3b8" font-family="monospace" font-size="12">  status: VARCHAR(20)</text>
    <text x="15" y="180" fill="#67e8f9" font-family="monospace" font-size="12">⚓ autor_id: BIGINT (FK)</text>
    <text x="15" y="200" fill="#34d399" font-family="monospace" font-size="12">⚓ curso_id: BIGINT (FK)</text>
  </g>

  <!-- Table 4: RESPUESTAS -->
  <g transform="translate(575, 170)">
    <rect width="190" height="175" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <rect width="190" height="32" rx="8" fill="#be185d"/>
    <text x="15" y="22" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">TABLE: respuestas</text>
    <text x="15" y="55" fill="#facc15" font-family="monospace" font-size="12">🔑 id: BIGINT (PK)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="12">  mensaje: TEXT</text>
    <text x="15" y="105" fill="#94a3b8" font-family="monospace" font-size="12">  solucion: BOOLEAN</text>
    <text x="15" y="130" fill="#c084fc" font-family="monospace" font-size="12">⚓ topico_id: BIGINT (FK)</text>
    <text x="15" y="155" fill="#67e8f9" font-family="monospace" font-size="12">⚓ autor_id: BIGINT (FK)</text>
  </g>

  <!-- Connection paths -->
  <path d="M250 160 H300" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
  <path d="M250 320 H280 V250 H300" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <path d="M525 240 H575" stroke="#ec4899" stroke-width="2" stroke-dasharray="4"/>
</svg>
